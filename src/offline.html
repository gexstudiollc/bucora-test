<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Bucora</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #0b1220;
    color: #eef2f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .logo {
    width: 220px;
    max-width: 60vw;
    margin-bottom: 36px;
    filter: drop-shadow(0 4px 20px rgba(37, 99, 235, 0.35));
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    color: #9aa5b1;
    margin: 0 0 28px;
    max-width: 360px;
    line-height: 1.5;
  }
  button {
    background: linear-gradient(90deg, #0033ff, #00e0c6);
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active {
    transform: scale(0.98);
  }
  .status {
    margin-top: 14px;
    font-size: 12px;
    color: #6b7480;
    min-height: 16px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="logo.png" alt="Bucora" />
    <h1>Sin conexión a internet</h1>
    <p>No pudimos conectarnos a Bucora. Revisá tu conexión a internet e intentá de nuevo.</p>
    <button id="retryBtn">Reintentar</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    const btn = document.getElementById('retryBtn');
    const status = document.getElementById('status');
    btn.addEventListener('click', () => {
      status.textContent = 'Probando conexión...';
      window.bucoraApp.retryConnection();
      setTimeout(() => { status.textContent = ''; }, 3000);
    });
  </script>
</body>
</html>
